name: CI

# pull_request runs without secrets and with a read-only token for forks.
# Never switch this to pull_request_target.
on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Takes the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Dependency rules
        run: pnpm depcruise

      - name: Unit tests
        run: pnpm test

      - name: API e2e tests
        run: pnpm test:e2e

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Playwright tests
        run: pnpm test:playwright

      - name: Build
        run: pnpm build
        env:
          API_ORIGIN: http://localhost:4000

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t repairflow-api:ci .
